name: Ops Proxmox Smoke Test
on: [push, workflow_dispatch]
jobs:
  smoke:
    runs-on: [self-hosted, docker]
    steps:
      - uses: actions/checkout@v4
      - run: sudo whoami
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: docker version
      - run: echo OPS_PROXMOX_SMOKE_TEST_PASSED
